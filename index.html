<!DOCTYPE html> 
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Headbangers Rock 'n' Rente · Start</title>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #050507;
      color: #d2a75a;
      font-family: Georgia, serif;
      display: grid;
      place-items: center;
      text-align: center;
    }
    .loader {
      opacity: 0.85;
      font-size: 1rem;
      letter-spacing: 0.12em;
    }
  </style>
</head>
<body>
  <div class="loader">🤘 Lade Headbangers Rock 'n' Rente...</div>

  <script>
    const ZIEL_SEITE = "Headbangers_Cache.html";
    let weitergeleitet = false;

    function go() {
      if (weitergeleitet) return;
      weitergeleitet = true;
      window.location.replace(ZIEL_SEITE);
    }

    // Sicherheits-Fallback: Spätestens nach 1,8 Sek. weiterleiten
    setTimeout(go, 1800);

    // 1. Anonyme Cacher-ID erzeugen / auslesen
    function getVisitorId() {
      let id = localStorage.getItem("hb_visitor_id");
      if (!id) {
        id = "Cacher-" + Math.random().toString(36).substring(2, 6).toUpperCase();
        localStorage.setItem("hb_visitor_id", id);
      }
      return id;
    }

    // 2. Betriebssystem, Browser & Gerätetyp erkennen (PC & Smartphone)
    function getSystemInfo() {
      const ua = navigator.userAgent || "";
      let os = "Unbekannt";
      if (/iPhone|iPad|iPod/i.test(ua)) {
        const m = ua.match(/OS (\d+[_\d]*)/);
        os = "iOS" + (m ? " " + m[1].replace(/_/g, ".") : "");
      } else if (/Android/i.test(ua)) {
        const m = ua.match(/Android (\d+[\.\d]*)/);
        os = "Android" + (m ? " " + m[1] : "");
      } else if (/Windows NT 10\.0/i.test(ua)) {
        os = "Windows 10/11";
      } else if (/Mac OS X/i.test(ua)) {
        os = "macOS";
      } else if (/Linux/i.test(ua)) {
        os = "Linux";
      }

      let browser = "Unbekannt";
      if (/EdgA|EdgiOS|Edg\//i.test(ua)) browser = "Edge";
      else if (/OPR|Opera/i.test(ua)) browser = "Opera";
      else if (/SamsungBrowser/i.test(ua)) browser = "Samsung Internet";
      else if (/Firefox|FxiOS/i.test(ua)) browser = "Firefox";
      else if (/CriOS|Chrome\//i.test(ua)) browser = "Chrome";
      else if (/Safari/i.test(ua)) browser = "Safari";

      const geraet = /Mobi|Android|iPhone|iPad/i.test(ua) ? "Smartphone" : "PC/Tablet";
      return { ua, os, browser, geraet };
    }

    // 3. Alle Infos parallel einsammeln und in Firebase speichern
    async function trackAndRedirect() {
      try {
        firebase.initializeApp({
          databaseURL: "https://headbangerdiplom-default-rtdb.europe-west1.firebasedatabase.app/"
        });
        const db = firebase.database();

        const sys = getSystemInfo();
        const visitorId = getVisitorId();
        const orientierung = window.innerHeight >= window.innerWidth ? "Hochformat" : "Querformat";
        const aufloesung = `${window.screen.width}x${window.screen.height} (${orientierung}, DPR ${window.devicePixelRatio || 1})`;
        const sprache = navigator.language || "k.A.";
        const alleSprachen = Array.isArray(navigator.languages) ? navigator.languages.join(", ") : sprache;
        const zeitzone = Intl.DateTimeFormat().resolvedOptions().timeZone || "k.A.";
        const referrer = document.referrer ? document.referrer : "Direktaufruf / QR-Code";

        // Netzwerk-Info (falls unterstützt)
        const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        const netzwerk = conn
          ? `${conn.effectiveType || "unbekannt"}${conn.downlink ? " (~" + conn.downlink + " Mbit/s)" : ""}`
          : "k.A.";

        // Hardware-Eckdaten (RAM & CPU-Kerne)
        const hardware = [
          navigator.deviceMemory ? `${navigator.deviceMemory} GB RAM` : null,
          navigator.hardwareConcurrency ? `${navigator.hardwareConcurrency} Kerne` : null
        ].filter(Boolean).join(" / ") || "k.A.";

        // Akku, Gerätemodell & Geo-IP parallel abfragen, damit keine Zeit verloren geht
        const batteryTask = (async () => {
          try {
            if (navigator.getBattery) {
              const bat = await navigator.getBattery();
              return `${Math.round(bat.level * 100)}% (${bat.charging ? "Lädt" : "Akku"})`;
            }
          } catch (_) {}
          return "k.A.";
        })();

        const modelTask = (async () => {
          if (/iPhone/i.test(sys.ua)) return "Apple iPhone";
          if (/iPad/i.test(sys.ua)) return "Apple iPad";
          if (sys.geraet === "PC/Tablet") return "Desktop / Notebook";
          try {
            if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
              const hints = await navigator.userAgentData.getHighEntropyValues(["model"]);
              if (hints.model) return hints.model;
            }
          } catch (_) {}
          return "k.A.";
        })();

        const geoTask = (async () => {
          try {
            const ctrl = new AbortController();
            const t = setTimeout(() => ctrl.abort(), 700);
            const res = await fetch("https://ipwho.is/", { signal: ctrl.signal });
            clearTimeout(t);
            if (res.ok) {
              const geo = await res.json();
              if (geo && geo.success) {
                return `${geo.city || "?"} (${geo.country_code || "?"})`;
              }
            }
          } catch (_) {}
          return "k.A.";
        })();

        const [akku, modell, ort] = await Promise.all([batteryTask, modelTask, geoTask]);

        const logEintrag = {
          zeitpunkt: new Date().toLocaleString("de-DE", {
            day: "2-digit", month: "2-digit", year: "numeric",
            hour: "2-digit", minute: "2-digit", second: "2-digit"
          }),
          timestamp: Date.now(),
          besucherId: visitorId,
          geraet: sys.geraet,
          modell: modell,
          os: sys.os,
          browser: sys.browser,
          aufloesung: aufloesung,
          hardware: hardware,
          akku: akku,
          netzwerk: netzwerk,
          ort: ort,
          sprache: sprache,
          alleSprachen: alleSprachen,
          zeitzone: zeitzone,
          referrer: referrer
        };

        await Promise.all([
          db.ref("statistik/Einstieg Startseite/aufrufe").transaction((n) => (n || 0) + 1),
          db.ref("statistik/Einstieg Startseite/logs").push(logEintrag)
        ]);
      } catch (e) {
        console.warn("Tracking-Hinweis:", e);
      } finally {
        go();
      }
    }

    trackAndRedirect();
  </script>
</body>
</html>
