<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Live-Radar · Headbangers Rock'n Rente</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Outfit', sans-serif;
            background: #0d0a14;
            color: #f0f0f5;
            padding: 30px 16px 60px;
            text-align: center;
            overflow-x: hidden;
        }
        .container { max-width: 960px; margin: 0 auto; width: 100%; }

        /* Zentrierter Haupttitel mit 🤘 links und rechts */
        .title-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 4px;
        }
        .title-icon {
            font-size: clamp(2rem, 6vw, 3rem);
            line-height: 1;
            display: inline-flex;
            align-items: center;
        }
        h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(2.6rem, 8vw, 3.6rem);
            color: #ffea00;
            letter-spacing: 2px;
            line-height: 1;
            margin: 0;
        }
        .title-sub {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(2.2rem, 7vw, 3.2rem);
            color: #ffea00;
            letter-spacing: 2px;
            line-height: 1.05;
            margin-bottom: 12px;
        }
        .subtitle {
            color: #00f0ff;
            margin-bottom: 30px;
            font-weight: 600;
            font-size: 1.05rem;
        }

        /* Kacheln für die Seiten-Übersicht */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 16px;
            margin-bottom: 35px;
        }
        .stat-card {
            background: rgba(25, 20, 38, 0.9);
            border: 2px solid #00f0ff;
            border-radius: 18px;
            padding: 20px 16px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 240, 255, 0.15);
            overflow-wrap: anywhere;
        }
        .stat-card h3 {
            color: #a0a0b8;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 10px;
            line-height: 1.35;
        }
        .stat-number {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 3.8rem;
            color: #ffea00;
            line-height: 1;
        }
        .stat-last {
            margin-top: 10px;
            font-size: 0.82rem;
            color: #808095;
        }

        /* Verlaufs-Box */
        .log-box {
            background: rgba(20, 16, 32, 0.9);
            border: 2px solid #ff5500;
            border-radius: 20px;
            padding: 24px 18px;
            width: 100%;
        }
        .log-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .log-header h2 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.1rem;
            color: #ff5500;
            letter-spacing: 1.5px;
            line-height: 1.1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .log-header .log-sub {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.8rem;
            color: #ff5500;
            letter-spacing: 1.5px;
            line-height: 1.1;
            margin-top: 2px;
        }

        /* PC-Ansicht: Klassische 3-Spalten-Tabelle */
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th {
            padding: 12px 10px;
            border-bottom: 2px solid rgba(255,255,255,0.12);
            color: #00f0ff;
            font-size: 0.85rem;
            text-transform: uppercase;
            white-space: nowrap;
        }
        td {
            padding: 12px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            font-size: 0.92rem;
            vertical-align: middle;
        }
        .col-time {
            white-space: nowrap;
            color: #d0d0e0;
        }
        .col-device {
            white-space: nowrap;
            color: #b8b8cc;
        }
        .tag {
            background: rgba(255, 234, 0, 0.15);
            color: #ffea00;
            padding: 5px 10px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.84rem;
            display: inline-block;
            overflow-wrap: anywhere;
            word-break: break-word;
            line-height: 1.35;
        }

        /* Smartphone-Ansicht: Kompakte Karten statt abgeschnittener Tabelle */
        @media (max-width: 640px) {
            body {
                padding: 22px 12px 50px;
            }
            .cards-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            .stat-card {
                padding: 16px 10px;
            }
            .stat-card h3 {
                font-size: 0.78rem;
            }
            .stat-number {
                font-size: 3.1rem;
            }
            .log-box {
                padding: 20px 14px;
            }
            table, tbody, tr, td {
                display: block;
                width: 100%;
            }
            thead {
                display: none;
            }
            tbody tr {
                background: rgba(255, 255, 255, 0.035);
                border: 1px solid rgba(255, 255, 255, 0.08);
                border-radius: 12px;
                padding: 12px;
                margin-bottom: 10px;
                display: grid;
                grid-template-columns: 1fr auto;
                gap: 8px 10px;
                align-items: center;
            }
            tbody tr:last-child {
                margin-bottom: 0;
            }
            td {
                padding: 0;
                border: none;
            }
            td.col-time {
                grid-column: 1;
                grid-row: 1;
                font-size: 0.82rem;
                color: #a8a8be;
            }
            td.col-device {
                grid-column: 2;
                grid-row: 1;
                font-size: 0.8rem;
                color: #00f0ff;
                text-align: right;
            }
            td.col-page {
                grid-column: 1 / -1;
                grid-row: 2;
            }
            .tag {
                width: 100%;
                font-size: 0.85rem;
                padding: 6px 10px;
            }
        }

        /* Ganz schmale Displays (< 380px): 1 Kachel pro Reihe */
        @media (max-width: 380px) {
            .cards-grid {
                grid-template-columns: 1fr;
            }
        }

        .reset-wrapper {
            text-align: center;
            margin-top: 25px;
        }
        .reset-btn {
            background: transparent;
            border: 1.5px solid #ff0055;
            color: #ff0055;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            font-family: 'Outfit', sans-serif;
            transition: all 0.2s ease;
        }
        .reset-btn:hover { background: #ff0055; color: white; }
    </style>
</head>
<body>

<div class="container" id="dashboard" style="display:none;">
    <div class="title-row">
        <span class="title-icon">🤘</span>
        <h1>HEADBANGER</h1>
        <span class="title-icon">🤘</span>
    </div>
    <div class="title-sub">LIVE-RADAR</div>
    <div class="subtitle">Echtzeit-Statistik für GCBY17R</div>

    <!-- Übersichtskacheln pro Seite -->
    <div class="cards-grid" id="summaryCards">
        <p style="text-align:center; grid-column: 1/-1; color:#888;">Lade Daten aus Firebase...</p>
    </div>

    <!-- Chronologisches Protokoll -->
    <div class="log-box">
        <div class="log-header">
            <h2><span>🕒</span> LETZTE ZUGRIFFE</h2>
            <div class="log-sub">(LIVE-VERLAUF)</div>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Datum & Uhrzeit</th>
                    <th>Station / Seite</th>
                    <th>Gerät</th>
                </tr>
            </thead>
            <tbody id="logTableBody">
            </tbody>
        </table>
        <div class="reset-wrapper">
            <button class="reset-btn" onclick="resetStats()">🗑️ Testdaten zurücksetzen</button>
        </div>
    </div>
</div>

<script>
    const GEHEIME_PIN = "1967";
    const eingabe = prompt("🔒 Admin-PIN eingeben:");
    if (eingabe === GEHEIME_PIN) {
        document.getElementById('dashboard').style.display = 'block';
    } else {
        document.body.innerHTML = "<h2 style='text-align:center; margin-top:100px; color:#ff0055;'>⛔ Zugriff verweigert</h2>";
    }

    firebase.initializeApp({
        databaseURL: "https://headbangerdiplom-default-rtdb.europe-west1.firebasedatabase.app/"
    });
    const db = firebase.database();

    // Live-Abruf aus Firebase
    db.ref('statistik').on('value', (snapshot) => {
        const statsData = snapshot.val();
        const cardsContainer = document.getElementById('summaryCards');
        const tableBody = document.getElementById('logTableBody');

        cardsContainer.innerHTML = '';
        tableBody.innerHTML = '';

        if (!statsData) {
            cardsContainer.innerHTML = '<p style="text-align:center; grid-column: 1/-1; color:#888;">Noch keine Aufrufe erfasst.</p>';
            return;
        }

        let alleLogs = [];

        Object.keys(statsData).forEach((seitenKey) => {
            const seite = statsData[seitenKey];
            const anzahl = seite.aufrufe || 0;
            let letzterAufruf = "Keine Zeitangabe";

            if (seite.logs) {
                const logEintraege = Object.values(seite.logs);
                logEintraege.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                if (logEintraege.length > 0 && logEintraege[0].zeitpunkt) {
                    letzterAufruf = logEintraege[0].zeitpunkt;
                }

                logEintraege.forEach(log => {
                    alleLogs.push({
                        seite: seitenKey,
                        zeitpunkt: log.zeitpunkt || '-',
                        geraet: log.geraet || '-',
                        timestamp: log.timestamp || 0
                    });
                });
            }

            const card = document.createElement('div');
            card.className = 'stat-card';
            card.innerHTML = `
                <h3>📄 ${seitenKey}</h3>
                <div class="stat-number">${anzahl}</div>
                <div class="stat-last">Zuletzt: ${letzterAufruf}</div>
            `;
            cardsContainer.appendChild(card);
        });

        alleLogs.sort((a, b) => b.timestamp - a.timestamp);

        alleLogs.slice(0, 50).forEach(entry => {
            const geraetIcon = entry.geraet.toLowerCase().includes('smartphone') ? '📱 ' : '💻 ';
            const row = document.createElement('tr');
            row.innerHTML = `
                <td class="col-time">${entry.zeitpunkt}</td>
                <td class="col-page"><span class="tag">${entry.seite}</span></td>
                <td class="col-device">${geraetIcon}${entry.geraet}</td>
            `;
            tableBody.appendChild(row);
        });
    }, (error) => {
        alert("Fehler beim Abrufen der Statistik: " + error.message);
    });

    // Löschen der Testdaten in Firebase
    function resetStats() {
        if (confirm("Wirklich alle bisher gezählten Test-Aufrufe löschen?")) {
            db.ref('statistik').remove()
                .then(() => {
                    alert("✅ Alle Testdaten wurden erfolgreich gelöscht.");
                })
                .catch((error) => {
                    alert("❌ Fehler beim Löschen (Firebase-Regeln prüfen!): " + error.message);
                });
        }
    }
</script>

</body>
</html>
