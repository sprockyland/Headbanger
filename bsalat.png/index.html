<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bsalat.png</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body {
            margin: 0;
            background: #0e0e0e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        img {
            max-width: 100%;
            max-height: 100vh;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <img src="../bsalat_bild.png" alt="Station">

    <script>
        firebase.initializeApp({
            databaseURL: "https://headbangerdiplom-default-rtdb.europe-west1.firebasedatabase.app/"
        });
        const db = firebase.database();

        function getVisitorId() {
            let id = localStorage.getItem("hb_visitor_id");
            if (!id) {
                id = "Cacher-" + Math.random().toString(36).substring(2, 6).toUpperCase();
                localStorage.setItem("hb_visitor_id", id);
            }
            return id;
        }

        function detectBrowser(ua) {
            if (/EdgA|EdgiOS|Edg/i.test(ua)) return "Edge";
            if (/OPR|Opera/i.test(ua)) return "Opera";
            if (/SamsungBrowser/i.test(ua)) return "Samsung Internet";
            if (/Firefox|FxiOS/i.test(ua)) return "Firefox";
            if (/CriOS|Chrome/i.test(ua)) return "Chrome";
            if (/Safari/i.test(ua)) return "Safari";
            return "Sonstiger Browser";
        }

        function detectOS(ua) {
            const androidMatch = ua.match(/Android\s([0-9.]+)/i);
            if (androidMatch) return "Android " + androidMatch[1];
            const iosMatch = ua.match(/OS\s([0-9_]+)\slike\sMac\sOS\sX/i);
            if (iosMatch) return "iOS " + iosMatch[1].replace(/_/g, ".");
            if (/Windows/i.test(ua)) return "Windows";
            if (/Mac OS X/i.test(ua)) return "macOS";
            return "Unbekanntes OS";
        }

        async function collectAndSendStats() {
            const ua = navigator.userAgent || "";
            const istHandy = /Mobi|Android|iPhone|iPad/i.test(ua) ? "Smartphone" : "PC/Tablet";

            // Sprache & Zeitzone (Indikator für Sprachraum/Herkunft)
            const sprache = navigator.language || "k.A.";
            const alleSprachen = Array.isArray(navigator.languages) ? navigator.languages.join(", ") : sprache;
            const zeitzone = Intl.DateTimeFormat().resolvedOptions().timeZone || "k.A.";

            // Display & Orientierung
            const orientierung = window.innerHeight >= window.innerWidth ? "Hochformat" : "Querformat";
            const aufloesung = `${window.screen.width}x${window.screen.height} (${orientierung}, DPR ${window.devicePixelRatio || 1})`;

            // Netzwerk (falls vom Browser unterstützt)
            const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            const netzwerk = conn
                ? `${conn.effectiveType || "unbekannt"}${conn.downlink ? " (~" + conn.downlink + " Mbit/s)" : ""}`
                : "k.A.";

            // Hardware-Eckdaten
            const hardware = [
                navigator.deviceMemory ? `${navigator.deviceMemory} GB RAM` : null,
                navigator.hardwareConcurrency ? `${navigator.hardwareConcurrency} Kerne` : null
            ].filter(Boolean).join(" / ") || "k.A.";

            // Akkustand (funktioniert auf Android/Chrome)
            let akku = "k.A.";
            try {
                if (navigator.getBattery) {
                    const bat = await navigator.getBattery();
                    akku = `${Math.round(bat.level * 100)}% (${bat.charging ? "lädt" : "Akku"})`;
                }
            } catch (e) {}

            // Gerätemodell über High-Entropy Client Hints (Android/Chrome)
            let modell = /iPhone/i.test(ua) ? "Apple iPhone" : (/iPad/i.test(ua) ? "Apple iPad" : "k.A.");
            try {
                if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
                    const hints = await navigator.userAgentData.getHighEntropyValues(["model", "platformVersion"]);
                    if (hints.model) modell = hints.model;
                }
            } catch (e) {}

            const logEntry = {
                zeitpunkt: new Date().toLocaleString("de-DE", {
                    day: "2-digit",
                    month: "2-digit",
                    year: "numeric",
                    hour: "2-digit",
                    minute: "2-digit",
                    second: "2-digit"
                }),
                besucherId: getVisitorId(),
                geraet: istHandy,
                modell: modell,
                os: detectOS(ua),
                browser: detectBrowser(ua),
                sprache: sprache,
                alleSprachen: alleSprachen,
                zeitzone: zeitzone,
                aufloesung: aufloesung,
                netzwerk: netzwerk,
                hardware: hardware,
                akku: akku,
                referrer: document.referrer || "Direktaufruf / QR-Code",
                timestamp: Date.now()
            };

            db.ref("statistik/LaternenCode erfasst/aufrufe").transaction((n) => (n || 0) + 1);
            db.ref("statistik/LaternenCode erfasst/logs").push(logEntry);
        }

        collectAndSendStats();
    </script>
</body>
</html>
